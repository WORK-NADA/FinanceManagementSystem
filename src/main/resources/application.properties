# Application
spring.application.name=FinanceManagementSystem

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
# Overridable via JPA_DDL_AUTO env var: use 'validate' or 'none' in production to prevent destructive schema changes
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

# Logging - keep INFO in production to avoid leaking query parameters (passwords, phone numbers, amounts) into logs
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO

# HikariCP Connection Pool - prevents Aiven/cloud MySQL from dropping idle sockets (Communications link failure)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# CORS - configure CORS_ALLOWED_ORIGINS env var in Render dashboard to avoid rebuilding JAR for frontend URL changes
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://127.0.0.1:5176,https://e-vyapar-crm.vercel.app}

# Server Port
server.port=${PORT:8080}

# JWT
jwt.secretKey=${JWT_SECRET_KEY}

# Local secrets file (optional in production)
spring.config.import=optional:secrets.properties